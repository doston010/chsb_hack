<html lang="uz">

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-deep:    #0b0f1a;
      --bg-card:    #111827;
      --bg-section: #0d1320;
      --border:     rgba(255,255,255,0.07);
      --accent-1:   #6366f1;
      --accent-2:   #8b5cf6;
      --accent-3:   #06b6d4;
      --text-main:  #f1f5f9;
      --text-muted: #94a3b8;
      --radius:     14px;
      --transition: 0.28s cubic-bezier(.4,0,.2,1);
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg-deep);
      color: var(--text-main);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── HEADER ── */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(11,15,26,.85);
      backdrop-filter: blur(18px);
      border-bottom: 1px solid var(--border);
      padding: 0 2rem;
    }
    .header-inner {
      max-width: 1400px;
      margin: 0 auto;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .logo {
      font-size: 1.45rem;
      font-weight: 800;
      background: linear-gradient(135deg, var(--accent-1), var(--accent-3));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -0.5px;
    }
    .logo span { font-weight: 300; opacity: .7; }
    .badge-count {
      background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
      color: #fff;
      font-size: .72rem;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 20px;
      letter-spacing: .5px;
    }

    /* ── NAV SIDEBAR ── */
    .nav-wrapper {
      position: fixed;
      left: 0; top: 64px; bottom: 0;
      width: 220px;
      padding: 1.5rem 1rem;
      background: rgba(13,19,32,.95);
      border-right: 1px solid var(--border);
      overflow-y: auto;
      z-index: 90;
    }
    .nav-title {
      font-size: .65rem;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 1rem;
      padding: 0 .5rem;
    }
    .nav-list { list-style: none; display: flex; flex-direction: column; gap: 3px; }
    .nav-list a {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 12px;
      border-radius: 9px;
      color: var(--text-muted);
      text-decoration: none;
      font-size: .88rem;
      font-weight: 500;
      transition: var(--transition);
    }
    .nav-list a:hover,
    .nav-list a.active {
      background: rgba(99,102,241,.15);
      color: var(--text-main);
    }
    .nav-list a .nav-icon { font-size: 1.1rem; flex-shrink: 0; }
    .nav-list a .nav-count {
      margin-left: auto;
      font-size: .7rem;
      background: rgba(255,255,255,.08);
      padding: 1px 7px;
      border-radius: 20px;
      font-weight: 600;
    }

    /* ── MAIN ── */
    main {
      margin-left: 220px;
      padding: 2.5rem 2rem 4rem;
      max-width: 1400px;
    }

    /* ── HERO ── */
    .hero {
      text-align: center;
      padding: 3rem 1rem 2.5rem;
      margin-bottom: 2rem;
    }
    .hero h1 {
      font-size: clamp(2rem, 4vw, 3rem);
      font-weight: 800;
      background: linear-gradient(135deg, #fff 30%, var(--accent-3));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1.15;
      margin-bottom: .75rem;
    }
    .hero p {
      color: var(--text-muted);
      font-size: 1rem;
      max-width: 520px;
      margin: 0 auto;
    }

    /* ── STATS ROW ── */
    .stats-row {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      justify-content: center;
      margin-bottom: 3rem;
    }
    .stat-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: .85rem 1.4rem;
      text-align: center;
      min-width: 120px;
    }
    .stat-card .num {
      font-size: 1.6rem;
      font-weight: 800;
      background: linear-gradient(135deg, var(--accent-1), var(--accent-3));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .stat-card .lbl {
      font-size: .72rem;
      color: var(--text-muted);
      margin-top: 2px;
      letter-spacing: .4px;
    }

    /* ── SECTION ── */
    .subject-section {
      background: var(--bg-section);
      border: 1px solid var(--border);
      border-radius: 18px;
      margin-bottom: 2.5rem;
      overflow: hidden;
      transition: var(--transition);
    }
    .subject-section:hover { border-color: rgba(99,102,241,.35); }

    .section-header {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 1.35rem 1.75rem;
      cursor: pointer;
      user-select: none;
      border-bottom: 1px solid var(--border);
      transition: var(--transition);
    }
    .section-header:hover { background: rgba(255,255,255,.02); }
    .section-icon {
      width: 44px; height: 44px;
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.3rem;
      flex-shrink: 0;
    }
    .section-meta { flex: 1; }
    .section-title {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 2px;
    }
    .section-subtitle {
      font-size: .78rem;
      color: var(--text-muted);
    }
    .section-toggle {
      width: 32px; height: 32px;
      border-radius: 50%;
      background: rgba(255,255,255,.06);
      border: none;
      color: var(--text-muted);
      font-size: 1rem;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: var(--transition);
      flex-shrink: 0;
    }
    .section-toggle:hover { background: rgba(99,102,241,.25); color: #fff; }
    .section-toggle.open { transform: rotate(180deg); }

    .section-body {
      padding: 1.5rem;
    }
    .section-body.collapsed { display: none; }

    /* ── IMAGE GRID ── */
    .img-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 1rem;
    }
    .img-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      cursor: pointer;
      transition: var(--transition);
      position: relative;
    }
    .img-card:hover {
      transform: translateY(-4px);
      border-color: rgba(99,102,241,.5);
      box-shadow: 0 16px 40px rgba(0,0,0,.4);
    }
    .img-card:hover .img-overlay { opacity: 1; }
    .img-thumb {
      width: 100%;
      aspect-ratio: 4/3;
      object-fit: contain;
      background: #0c1222;
      display: block;
      padding: 6px;
    }
    .img-overlay {
      position: absolute;
      inset: 0;
      background: rgba(99,102,241,.18);
      display: flex; align-items: center; justify-content: center;
      opacity: 0;
      transition: var(--transition);
    }
    .img-overlay svg { width: 36px; height: 36px; fill: none; stroke: #fff; stroke-width: 2; }
    .img-label {
      padding: .6rem .85rem;
      font-size: .78rem;
      color: var(--text-muted);
      font-weight: 500;
      border-top: 1px solid var(--border);
      background: rgba(0,0,0,.2);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .img-num {
      background: rgba(99,102,241,.25);
      color: var(--accent-1);
      font-size: .65rem;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 20px;
    }

    /* ── LIGHTBOX ── */
    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 1000;
      background: rgba(0,0,0,.92);
      backdrop-filter: blur(8px);
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .lightbox.open { display: flex; }
    .lb-inner {
      position: relative;
      max-width: 90vw;
      max-height: 88vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .lb-img {
      max-width: 100%;
      max-height: 78vh;
      border-radius: 12px;
      object-fit: contain;
      box-shadow: 0 30px 80px rgba(0,0,0,.6);
    }
    .lb-caption {
      margin-top: .75rem;
      color: var(--text-muted);
      font-size: .85rem;
      text-align: center;
    }
    .lb-close {
      position: fixed;
      top: 1.2rem; right: 1.4rem;
      background: rgba(255,255,255,.1);
      border: 1px solid rgba(255,255,255,.15);
      width: 40px; height: 40px;
      border-radius: 50%;
      color: #fff; font-size: 1.2rem;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: var(--transition);
    }
    .lb-close:hover { background: rgba(239,68,68,.5); }
    .lb-nav {
      position: fixed;
      top: 50%; transform: translateY(-50%);
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.12);
      width: 46px; height: 46px;
      border-radius: 50%;
      color: #fff; font-size: 1.3rem;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: var(--transition);
    }
    .lb-nav:hover { background: rgba(99,102,241,.5); }
    .lb-prev { left: 1rem; }
    .lb-next { right: 1rem; }

    /* ── SCROLLBAR ── */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,.12); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(99,102,241,.5); }

    /* ── RESPONSIVE ── */
    @media (max-width: 900px) {
      .nav-wrapper { display: none; }
      main { margin-left: 0; padding: 1.5rem 1rem 3rem; }
      .img-grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); }
    }
    @media (max-width: 480px) {
      .img-grid { grid-template-columns: repeat(2, 1fr); }
    }

    /* ── BACK TO TOP ── */
    #backTop {
      position: fixed;
      bottom: 1.5rem; right: 1.5rem;
      width: 42px; height: 42px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
      border: none;
      color: #fff; font-size: 1.1rem;
      cursor: pointer;
      display: none;
      align-items: center; justify-content: center;
      box-shadow: 0 6px 20px rgba(99,102,241,.5);
      transition: var(--transition);
      z-index: 200;
    }
    #backTop.visible { display: flex; }
    #backTop:hover { transform: translateY(-3px); }

    /* ── SEARCH ── */
    .search-bar {
      display: flex;
      align-items: center;
      gap: .75rem;
      max-width: 400px;
      margin: 0 auto 2rem;
    }
    .search-bar input {
      flex: 1;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text-main);
      font-family: inherit;
      font-size: .9rem;
      padding: .6rem 1rem;
      outline: none;
      transition: var(--transition);
    }
    .search-bar input:focus { border-color: var(--accent-1); box-shadow: 0 0 0 3px rgba(99,102,241,.15); }
    .search-bar input::placeholder { color: var(--text-muted); }
  </style>
</head>
<body>

<!-- HEADER -->
<header>
  <div class="header-inner">

<!-- SIDEBAR NAV -->

<!-- MAIN -->
<main>

// ─── DATA ───────────────────────────────────────────────────────────────────

    files: sortFiles([

// Sort helper: image.png → 1, image copy.png → 2, image copy N.png → N+1
function sortFiles(arr) {
  return arr.slice().sort((a, b) => fileOrder(a) - fileOrder(b));
}
function fileOrder(name) {
  if (name === "image.png") return 1;
  if (name === "image copy.png") return 2;
  const m = name.match(/image copy (\d+)\.png/);
  return m ? parseInt(m[1]) + 1 : 99;
}
function fileLabel(name, idx) {
  return `${idx + 1}-rasm`;
}

// ─── LIGHTBOX STATE ──────────────────────────────────────────────────────────
let lbImages = []; // [{src, caption}]
let lbIndex  = 0;
let allImages = []; // flat list for cross-section nav

function openLightbox(images, index) {
  lbImages = images;
  lbIndex  = index;
  renderLb();
  document.getElementById("lightbox").classList.add("open");
  document.body.style.overflow = "hidden";
}
function closeLightbox() {
  document.getElementById("lightbox").classList.remove("open");
  document.body.style.overflow = "";
}
function renderLb() {
  const { src, caption } = lbImages[lbIndex];
  document.getElementById("lbImg").src = src;
  document.getElementById("lbImg").alt = caption;
  document.getElementById("lbCaption").textContent = caption;
}
document.getElementById("lbClose").addEventListener("click", closeLightbox);
document.getElementById("lightbox").addEventListener("click", e => {
  if (e.target === document.getElementById("lightbox")) closeLightbox();
});
document.getElementById("lbPrev").addEventListener("click", () => {
  lbIndex = (lbIndex - 1 + lbImages.length) % lbImages.length;
  renderLb();
});
document.getElementById("lbNext").addEventListener("click", () => {
  lbIndex = (lbIndex + 1) % lbImages.length;
  renderLb();
});
document.addEventListener("keydown", e => {
  if (!document.getElementById("lightbox").classList.contains("open")) return;
  if (e.key === "Escape") closeLightbox();
  if (e.key === "ArrowLeft")  { lbIndex = (lbIndex - 1 + lbImages.length) % lbImages.length; renderLb(); }
  if (e.key === "ArrowRight") { lbIndex = (lbIndex + 1) % lbImages.length; renderLb(); }
});

// ─── BUILD DOM ───────────────────────────────────────────────────────────────

const navList    = document.getElementById("navList");
const statsRow   = document.getElementById("statsRow");
let totalImages  = 0;

  // NAV item
  const li = document.createElement("li");
  li.innerHTML = `<a href="#sec-${subj.id}" id="nav-${subj.id}">
    <span class="nav-icon">${subj.icon}</span>
    ${subj.label}
    <span class="nav-count">${subj.files.length}</span>
  </a>`;
  navList.appendChild(li);

  // Stats card
  const sc = document.createElement("div");
  sc.className = "stat-card";
  sc.innerHTML = `<div class="num" style="background:linear-gradient(135deg,${subj.color},#fff);-webkit-background-clip:text;background-clip:text;">${subj.files.length}</div>
    <div class="lbl">${subj.icon} ${subj.label}</div>`;
  statsRow.appendChild(sc);

  // Section
  const section = document.createElement("section");
  section.className = "subject-section";
  section.id = `sec-${subj.id}`;

  // prepare image data for this section
  const imgData = subj.files.map((f, fi) => ({
    src: `${subj.id}/${f}`,
    caption: `${subj.label} — ${fileLabel(f, fi)}`
  }));

  // header
  const header = document.createElement("div");
  header.className = "section-header";
  header.setAttribute("role", "button");
  header.setAttribute("tabindex", "0");
  header.innerHTML = `
    <div class="section-icon" style="background:${subj.bg};color:${subj.color};">${subj.icon}</div>
    <div class="section-meta">
      <div class="section-title" style="color:${subj.color};">${subj.label}</div>
      <div class="section-subtitle">${subj.files.length} ta rasm</div>
    </div>
    <button class="section-toggle open" aria-label="Yopish/ochish">▾</button>
  `;

  const body = document.createElement("div");
  body.className = "section-body";

  const grid = document.createElement("div");
  grid.className = "img-grid";

  subj.files.forEach((file, fi) => {
    const card = document.createElement("div");
    card.className = "img-card";
    card.setAttribute("tabindex", "0");
    card.setAttribute("role", "button");
    card.setAttribute("aria-label", `${subj.label} ${fi+1}-rasm`);
    card.innerHTML = `
      <img class="img-thumb" src="${subj.id}/${encodeURIComponent(file)}" alt="${subj.label} ${fi+1}-rasm" loading="lazy" />
      <div class="img-overlay">
        <svg viewBox="0 0 24 24"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg>
      </div>
      <div class="img-label">
        <span>${fileLabel(file, fi)}</span>
        <span class="img-num">${fi+1}/${subj.files.length}</span>
      </div>
    `;
    card.addEventListener("click", () => openLightbox(imgData, fi));
    card.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") openLightbox(imgData, fi); });
    grid.appendChild(card);
  });

  body.appendChild(grid);
  section.appendChild(header);
  section.appendChild(body);
  sectionsEl.appendChild(section);

  // Toggle
  const toggle = header.querySelector(".section-toggle");
  header.addEventListener("click", () => {
    const open = !body.classList.contains("collapsed");
    body.classList.toggle("collapsed", open);
    toggle.classList.toggle("open", !open);
    toggle.setAttribute("aria-label", open ? "Ochish" : "Yopish");
  });
  header.addEventListener("keydown", e => {
    if (e.key === "Enter" || e.key === " ") header.click();
  });
});

// update badge
document.getElementById("totalBadge").textContent = `${totalImages} ta rasm`;

// ─── SEARCH ──────────────────────────────────────────────────────────────────
document.getElementById("searchInput").addEventListener("input", function () {
  const q = this.value.toLowerCase();
  document.querySelectorAll(".subject-section").forEach(sec => {
    const title = sec.querySelector(".section-title").textContent.toLowerCase();
    sec.style.display = title.includes(q) ? "" : "none";
  });
});

// ─── BACK TO TOP ─────────────────────────────────────────────────────────────
const backTop = document.getElementById("backTop");
window.addEventListener("scroll", () => {
  backTop.classList.toggle("visible", window.scrollY > 400);
});
backTop.addEventListener("click", () => window.scrollTo({ top: 0, behavior: "smooth" }));

// ─── ACTIVE NAV HIGHLIGHT ────────────────────────────────────────────────────
const observer = new IntersectionObserver(entries => {
  entries.forEach(e => {
    if (e.isIntersecting) {
      const id = e.target.id.replace("sec-", "");
      document.querySelectorAll(".nav-list a").forEach(a => a.classList.remove("active"));
      const navA = document.getElementById(`nav-${id}`);
      if (navA) navA.classList.add("active");
    }
  });
}, { threshold: 0.25 });

document.querySelectorAll(".subject-section").forEach(sec => observer.observe(sec));
</script>
</body>
</html>
